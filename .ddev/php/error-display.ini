[PHP]
; Prevent raw PHP errors/warnings/deprecation notices (e.g. from BAT/BEE's
; PHP 8.4 implicit-nullable-parameter deprecations) from being written
; directly into the HTTP response body. Drupal's own error handling
; (system.logging:error_level, currently "hide") already controls whether
; errors are shown in a themed form and always logs to watchdog/dblog
; regardless of this setting — this only stops PHP's native, unstyled
; output from leaking into rendered pages.
display_errors = stderr
display_startup_errors = Off
