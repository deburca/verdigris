$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Image carousel
group: Base
description: "A hero-sized image carousel: one image visible at a time, with prev/next controls and dot indicators once there's more than one. Degrades to a single static image with no JavaScript."
props:
  type: object
  required:
    - items
  properties:
    items:
      title: Carousel images
      description: "One entry per image — the hestehoj:image media shape (src/alt/width/height)."
      type: array
      items:
        type: object
        required:
          - src
        properties:
          src:
            title: Image URL
            type: string
          alt:
            title: Alternative text
            type: string
          width:
            title: Width
            type: integer
          height:
            title: Height
            type: integer
libraryOverrides:
  js:
    image-carousel.js: { attributes: { type: module } }
