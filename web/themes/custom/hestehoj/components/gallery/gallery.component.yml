$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Gallery
group: Base
props:
  type: object
  required:
    - items
  properties:
    items:
      title: Gallery items
      description: "One entry per image: src/alt/width/height feed the grid tile (the hestehoj:image media shape), full_src is the original file the tile links to and the lightbox displays."
      type: array
      items:
        type: object
        required:
          - src
          - full_src
        properties:
          src:
            title: Tile image URL
            type: string
          alt:
            title: Alternative text
            type: string
          width:
            title: Width
            type: integer
          height:
            title: Height
            type: integer
          full_src:
            title: Full-size image URL
            type: string
libraryOverrides:
  js:
    gallery.js: { attributes: { type: module } }
