name: 'SHH Site Footer'
type: module
description: 'Renders the site footer through the theme''s slotted hestehoj:footer SDC (task 0032): site-name wordmark + the stable''s address/email (read live from the default Commerce store) + placeholder social links in Branding & Social; the footer menu (Privacy policy, task 0027''s Contact us) in Utility links; a computed copyright line; CTA slot deliberately empty per the 0032 client direction. Also ensures the Contact us footer-menu link (task 0027) and the social menu with placeholder Facebook/Instagram links (client to confirm real profile URLs). Originally (0027) placed a plain system menu block instead.'
core_version_requirement: ^10.2 || ^11
package: Custom
dependencies:
  - commerce_store:commerce_store
  - shh_common:shh_common
  - block:block
  - menu_link_content:menu_link_content
  - system:system
