name: 'SHH Rider Registration'
type: module
description: 'Opens account self-registration on the shh site with mandatory admin approval (user.settings: register: visitors_admin_approval) and adds a "Log in / Register" link to the main navigation. Also enforces the approval policy at runtime on all Commerce-created accounts (task 0034). Scoped to shh — other sites keep admin_only; client decision and policy rationale: task 0026.'
core_version_requirement: ^10.2 || ^11
package: Custom
dependencies:
  - shh_common:shh_common
  - menu_link_content:menu_link_content
  - system:system
  - user:user
