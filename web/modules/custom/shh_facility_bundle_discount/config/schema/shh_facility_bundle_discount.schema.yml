shh_facility_bundle_discount.settings:
  type: config_object
  label: 'SHH Facility Bundle Discount settings'
  mapping:
    product_ids:
      type: sequence
      label: 'Bundle product IDs'
      sequence:
        type: integer
    discount_amount:
      type: mapping
      label: 'Discount amount (per complete bundle)'
      mapping:
        number:
          type: string
        currency_code:
          type: string
