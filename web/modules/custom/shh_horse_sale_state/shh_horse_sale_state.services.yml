services:
  shh_horse_sale_state.availability_checker:
    class: Drupal\shh_horse_sale_state\Availability\HorseAvailabilityChecker
    arguments: ['@string_translation']
    tags:
      - { name: commerce_order.availability_checker }

  logger.channel.shh_horse_sale_state:
    parent: logger.channel_base
    arguments: ['shh_horse_sale_state']

  shh_horse_sale_state.completion_subscriber:
    class: Drupal\shh_horse_sale_state\EventSubscriber\HorseSaleCompletionSubscriber
    arguments: ['@logger.channel.shh_horse_sale_state']
    tags:
      - { name: event_subscriber }
