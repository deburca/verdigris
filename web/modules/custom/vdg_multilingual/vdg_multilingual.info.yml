name: 'VDG Multilingual'
type: module
description: 'Interface-translation deploy plumbing for verdigris.nu (task 0069). cex/cim do not carry {locales_target} rows, so the Danish UI strings that `drush language:add da` pulled from localize.drupal.org would never reach testing/production. This module ships them as a committed artifact (translations/da.po) and (re)imports them on install and on every `drush deploy` — as NOT_CUSTOMIZED, so any in-house customized string still wins and a later `locale:update` can refresh them. Enabled on vdg only (per-site core.extension); no config or schema of its own.'
core_version_requirement: ^10.2 || ^11
package: Custom
dependencies:
  - drupal:language
  - drupal:locale
