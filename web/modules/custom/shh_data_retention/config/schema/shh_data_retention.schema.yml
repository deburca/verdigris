shh_data_retention.settings:
  type: config_object
  label: 'SHH data retention settings'
  mapping:
    categories:
      type: mapping
      label: 'Retention windows in days per category (null = not confirmed, purge disabled)'
      mapping:
        contact_messages:
          type: integer
          label: 'Days after submission'
          nullable: true
        stale_registrations:
          type: integer
          label: 'Days after applying (unapproved, never-logged-in registrations)'
          nullable: true
