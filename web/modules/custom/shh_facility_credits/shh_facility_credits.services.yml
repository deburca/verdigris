services:
  shh_facility_credits.manager:
    class: Drupal\shh_facility_credits\FacilityCreditManager
    arguments: ['@entity_type.manager', '@logger.channel.shh_facility_credits']

  shh_facility_credits.pricing_helper:
    class: Drupal\shh_facility_credits\FacilityPricingHelper
    arguments: ['@commerce_price.rounder', '@config.factory']

  logger.channel.shh_facility_credits:
    parent: logger.channel_base
    arguments: ['shh_facility_credits']

  shh_facility_credits.checkout_completion_subscriber:
    class: Drupal\shh_facility_credits\EventSubscriber\CreditPackCheckoutCompletionSubscriber
    arguments: ['@shh_facility_credits.manager', '@shh_facility_credits.pricing_helper']
    tags:
      - { name: event_subscriber }
